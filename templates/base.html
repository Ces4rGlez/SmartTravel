<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartTravel{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <i class="fas fa-plane-departure"></i>
            <span>SmartTravel</span>
        </div>
        <button class="mobile-menu-toggle" id="mobile-menu-toggle">
            <i class="fas fa-bars"></i>
        </button>
        <nav class="header-nav" id="header-nav">
            <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="{{ url_for('buscar') }}" class="nav-link {% if request.path == '/buscar' %}active{% endif %}">
                <i class="fas fa-search-location"></i>
                <span>Buscar</span>
            </a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const headerNav = document.getElementById('header-nav');
        
        if (mobileToggle) {
            mobileToggle.addEventListener('click', () => {
                headerNav.classList.toggle('active');
            });
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
